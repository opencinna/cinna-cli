[project]
name = "cinna-cli"
version = "0.2.4"
description = "Local development CLI for Cinna Core agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "evgeny-l", email = "evgeny-l@opencinna.io" },
]
keywords = ["cinna", "cli", "agents", "mcp", "mutagen", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "textual>=0.50",
    "mcp>=1.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/opencinna/cinna-cli"
Repository = "https://github.com/opencinna/cinna-cli"
Issues = "https://github.com/opencinna/cinna-cli/issues"

[project.scripts]
cinna = "cinna.main:cli"
cinna-sync-ssh = "cinna.sync_ssh_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinna"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]
